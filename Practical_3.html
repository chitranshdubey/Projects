<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML List Examples</title>
</head>
<body>
  <p>Ordered list:</p>
  <ol>
    <li>Wake up</li>
    <li>Get ready</li>
    <li>Go to college</li>
  </ol>

  <p>Unordered list:</p>
  <ul>
    <li>Apples</li>
    <li>Bananas</li>
    <li>Oranges</li>
  </ul>

  <p>Description list:</p>
  <dl>
    <dt>HTML</dt>
    <dd>A markup language used to structure web pages.</dd>

    <dt>CSS</dt>
    <dd>A style sheet language used to design web pages.</dd>
  </dl>
</body>
</html>
